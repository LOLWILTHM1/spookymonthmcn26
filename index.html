<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COLD CASE DATABASE</title>

    <link rel="stylesheet" href="css/intro.css">
</head>

<body>

    <main id="terminal">

        <div id="scan-line"></div>

        <section id="terminal-screen">

            <div id="system-header">
                COLD CASE DATABASE
                <span>SYS://102</span>
            </div>

            <div id="terminal-output">

                <div id="history"></div>

            </div>

        </section>

        <div id="loading-area">

            <div id="loading-label">
                SYSTEM INITIALIZATION
            </div>

            <div id="loading-track">
                <div id="loading-progress"></div>
            </div>

            <div id="loading-percent">
                0%
            </div>

        </div>

        <div id="continue-prompt">
            [ PRESS ANY KEY TO CONTINUE ]
        </div>

        <div id="cursor">█</div>

    </main>

    <script src="js/intro.js"></script>

</body>

</html>
